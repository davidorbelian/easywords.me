name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  # Every pull request runs, because main requires the check before a merge.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: easywords:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test the image in browsers
        run: bash scripts/e2e-image.sh easywords:test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-results
          path: test-results/

  # Only this job can read the infra App key: the environment admits main alone.
  deploy:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
      - name: Write the image pin
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}@${{ steps.push.outputs.digest }}
        run: printf '%s\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"

      # Deploys the image: infra merges the pin once its checks pass (see AGENTS.md).
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.INFRA_BUMP_CLIENT_ID }}
          private-key: ${{ secrets.INFRA_BUMP_APP_KEY }}
          owner: davidorbelian
          repositories: infra
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v7
        with:
          repository: davidorbelian/infra
          token: ${{ steps.app.outputs.token }}
          path: infra
      - name: Pin the image in infra
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}@${{ steps.push.outputs.digest }}
        run: bash scripts/bump-infra.sh "$IMAGE"
