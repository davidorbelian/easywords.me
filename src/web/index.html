<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>easywords</title>
    <meta
      name="description"
      content="Paste hard text. Get the same text in easy words, with a score for how easy it is."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <header class="top">
      <a class="brand" href="/">
        <img src="favicon.svg" alt="" width="28" height="28" />
        <span>easywords</span>
      </a>
      <p class="tagline">Hard text in, easy words out.</p>
    </header>

    <main>
      <div class="toolbar">
        <div class="levels" role="radiogroup" aria-label="How simple">
          <label><input type="radio" name="level" value="simple" checked /><span>Simple</span></label>
          <label><input type="radio" name="level" value="simpler" /><span>Simpler</span></label>
          <label><input type="radio" name="level" value="simplest" /><span>Simplest</span></label>
        </div>
        <button id="run" class="run" type="button">
          <span class="run-label">Make it easy</span>
          <kbd class="run-keys" aria-hidden="true"></kbd>
        </button>
      </div>

      <div class="panes">
        <section class="pane" aria-labelledby="input-title">
          <div class="pane-head">
            <h2 id="input-title">Your text</h2>
            <output id="input-score" class="score" data-state="empty" aria-live="polite">
              <span class="score-label">Easy score</span><span class="score-value">–</span>
            </output>
          </div>
          <textarea
            id="input"
            spellcheck="false"
            aria-labelledby="input-title"
            placeholder="Paste some hard text here…"
          ></textarea>
          <div class="pane-foot">
            <span id="count" class="count">0 / 5,000</span>
          </div>
        </section>

        <div class="arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <path
              d="M5 12h13M13 6l6 6-6 6"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>

        <section class="pane" aria-labelledby="output-title">
          <div class="pane-head">
            <h2 id="output-title">Easy words</h2>
            <output id="output-score" class="score" data-state="empty" aria-live="polite">
              <span class="score-label">Easy score</span><span class="score-value">–</span>
              <span class="score-gain" hidden></span>
            </output>
          </div>
          <textarea
            id="output"
            readonly
            aria-labelledby="output-title"
            placeholder="Easy words show up here."
          ></textarea>
          <div class="pane-foot">
            <span id="status" class="status" role="status"></span>
            <button id="copy" class="copy" type="button" disabled>Copy</button>
          </div>
        </section>
      </div>
    </main>

    <footer class="bottom">Scores by Jev. Easy words by Claude. We do not save your text.</footer>
  </body>
</html>
