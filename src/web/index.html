<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>easywords</title>
    <meta name="description" content="Paste fancy text. Get the plain, rude truth, with a score for how easy it is." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <header class="top">
      <a class="brand" href="/">
        <img src="favicon.svg" alt="" width="28" height="28" />
        <span>easywords</span>
      </a>
      <p class="tagline">Fancy words in. Plain truth out.</p>
      <!-- admin -->
    </header>

    <main>
      <div class="toolbar">
        <div class="personalities" role="radiogroup" aria-label="Personality">
          <!-- personalities -->
        </div>
        <button id="run" class="run" type="button">
          <span class="run-label">Dumb it down</span>
          <kbd class="run-keys" aria-hidden="true"></kbd>
        </button>
      </div>

      <div class="panes">
        <section class="pane" aria-labelledby="input-title">
          <div class="pane-head">
            <h2 id="input-title">Fancy text</h2>
            <output id="input-score" class="score" data-state="empty" aria-live="polite">
              <span class="score-label">Easy score</span><span class="score-value">–</span>
            </output>
          </div>
          <textarea
            id="input"
            spellcheck="false"
            aria-labelledby="input-title"
            placeholder="Paste something that used way too many words…"
          ></textarea>
          <div class="pane-foot">
            <span id="count" class="count">0 / 5,000</span>
          </div>
        </section>

        <div class="arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <path
              d="M5 12h13M13 6l6 6-6 6"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>

        <section class="pane" aria-labelledby="output-title">
          <div class="pane-head">
            <h2 id="output-title">Plain truth</h2>
            <output id="output-score" class="score" data-state="empty" aria-live="polite">
              <span class="score-label">Easy score</span><span class="score-value">–</span>
              <span class="score-gain" hidden></span>
            </output>
          </div>
          <textarea
            id="output"
            readonly
            aria-labelledby="output-title"
            placeholder="The honest version shows up here."
          ></textarea>
          <div class="pane-foot">
            <span id="status" class="status" role="status"></span>
            <button id="copy" class="copy" type="button" disabled>Copy</button>
          </div>
        </section>
      </div>
    </main>

    <footer class="bottom">Scores by Jev. Rudeness by Claude. We don't save your text. We have standards.</footer>
  </body>
</html>
